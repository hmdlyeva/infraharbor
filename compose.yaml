name: infraharbor

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infraharbor}
      POSTGRES_USER: ${POSTGRES_USER:-infraharbor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - infraharbor-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [infraharbor]

  api:
    build:
      context: .
      dockerfile: deploy/docker/api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-infraharbor};Username=${POSTGRES_USER:-infraharbor};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Runtime__DeploymentName: ${Runtime__DeploymentName:-InfraHarbor Local}
      Runtime__PublicUrl: ${Runtime__PublicUrl:-http://localhost:3000}
      Bootstrap__Enabled: ${Bootstrap__Enabled:-false}
      Bootstrap__Token: ${Bootstrap__Token:-}
      Auth__Issuer: ${Auth__Issuer:-InfraHarbor}
      Auth__Audience: ${Auth__Audience:-InfraHarbor.Api}
      Auth__SigningKey: ${Auth__SigningKey:?Auth__SigningKey is required}
      Auth__AccessTokenLifetimeSeconds: ${Auth__AccessTokenLifetimeSeconds:-900}
      Auth__RefreshTokenLifetimeDays: ${Auth__RefreshTokenLifetimeDays:-30}
      Auth__ClockSkewSeconds: ${Auth__ClockSkewSeconds:-30}
      Auth__RefreshCookieName: ${Auth__RefreshCookieName:-infraharbor_refresh}
      Auth__SecureCookies: ${Auth__SecureCookies:-true}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [infraharbor]

  worker:
    build:
      context: .
      dockerfile: deploy/docker/worker/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-infraharbor};Username=${POSTGRES_USER:-infraharbor};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Runtime__DeploymentName: ${Runtime__DeploymentName:-InfraHarbor Local}
      Runtime__PublicUrl: ${Runtime__PublicUrl:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [infraharbor]

  web:
    build:
      context: .
      dockerfile: deploy/docker/web/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [infraharbor]

volumes:
  infraharbor-postgres:

networks:
  infraharbor:
    driver: bridge
