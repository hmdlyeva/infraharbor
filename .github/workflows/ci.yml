name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm lint:web
      - name: Typecheck
        run: pnpm typecheck:web
      - name: Build
        run: pnpm build:web

  dotnet:
    name: .NET validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: infraharbor_ci
          POSTGRES_USER: infraharbor
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infraharbor -d infraharbor_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ConnectionStrings__Database: Host=localhost;Port=5432;Database=infraharbor_ci;Username=infraharbor;Password=ci-only-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Restore
        run: dotnet restore InfraHarbor.slnx
      - name: Build
        run: dotnet build InfraHarbor.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test InfraHarbor.slnx --configuration Release --no-build --verbosity normal
      - name: Generate initial identity migration preview
        if: github.event_name == 'pull_request' && github.head_ref == 'task/IH-011-identity-schema'
        run: dotnet ef migrations add InitialIdentity --project src/InfraHarbor.Infrastructure --startup-project src/InfraHarbor.Api --output-dir Persistence/Migrations --configuration Release --no-build
      - name: Upload migration preview
        if: github.event_name == 'pull_request' && github.head_ref == 'task/IH-011-identity-schema'
        uses: actions/upload-artifact@v4
        with:
          name: ih-011-migration-preview
          path: src/InfraHarbor.Infrastructure/Persistence/Migrations
          if-no-files-found: error
