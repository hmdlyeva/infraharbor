name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm lint:web
      - name: Typecheck
        run: pnpm typecheck:web
      - name: Build
        run: pnpm build:web
      - name: Install Playwright Chromium
        run: pnpm --filter @infraharbor/web exec playwright install --with-deps chromium
      - name: Browser auth E2E
        run: pnpm --filter @infraharbor/web test:e2e
      - name: Diagnose unauthenticated shell E2E
        if: failure()
        continue-on-error: true
        run: pnpm --filter @infraharbor/web exec playwright test --grep "unauthenticated user cannot access"
      - name: Diagnose login persistence E2E
        if: failure()
        continue-on-error: true
        run: pnpm --filter @infraharbor/web exec playwright test --grep "login opens the protected shell"
      - name: Diagnose revoked refresh E2E
        if: failure()
        continue-on-error: true
        run: pnpm --filter @infraharbor/web exec playwright test --grep "expired or revoked refresh session"
      - name: Diagnose owner user-admin E2E
        if: failure()
        continue-on-error: true
        run: pnpm --filter @infraharbor/web exec playwright test --grep "owner can create, re-role and disable"
      - name: Diagnose viewer user-admin E2E
        if: failure()
        continue-on-error: true
        run: pnpm --filter @infraharbor/web exec playwright test --grep "viewer cannot open user administration"

  dotnet:
    name: .NET validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: infraharbor_ci
          POSTGRES_USER: infraharbor
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infraharbor -d infraharbor_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ConnectionStrings__Database: Host=localhost;Port=5432;Database=infraharbor_ci;Username=infraharbor;Password=ci-only-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Restore
        run: dotnet restore InfraHarbor.slnx
      - name: Build
        run: dotnet build InfraHarbor.slnx --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test tests/InfraHarbor.UnitTests/InfraHarbor.UnitTests.csproj --configuration Release --no-build --verbosity normal
      - name: Integration tests
        run: dotnet test tests/InfraHarbor.IntegrationTests/InfraHarbor.IntegrationTests.csproj --configuration Release --no-build --verbosity normal
      - name: Verify EF model matches committed migrations
        run: dotnet ef migrations has-pending-model-changes --project src/InfraHarbor.Infrastructure --startup-project src/InfraHarbor.Api --configuration Release --no-build
