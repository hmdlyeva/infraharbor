name: Feature request
description: Propose an improvement to InfraHarbor
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operational problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without prescribing unnecessary implementation detail.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security / privilege considerations
      description: Does this touch remote execution, credentials, networking, auth, or destructive operations?
